<style>
/* Layout: a drawing set. Title block, then the live model, then generated drawings, details (joints) and schedules. */
:root {
  --paper:#EEF1EE; --sheet:#F8FAF8; --ink:#1C2A2E; --muted:#56676B; --rule:#C8D1CE; --rule-strong:#93A2A1;
  --cedar:#8B3A1D; --cedar-soft:#F1E1D8; --flag:#C9520C; --steel:#5C7482; --ok:#2E6A3A; --ok-soft:#DDEBDF;
  --wood-fill:#CFA47C; --wood-end:#AE7A4E; --wood-peeled:#E6CBA6; --wood-line:#6B4127; --oak:#E2C79A;
  --concrete:#C9C8C1; --metal:#9AAAB2; --fw:#D8B98F; --gear:#B9B2A6; --sky:#DCE5E8;
  --font-display:"Jost","Futura","Century Gothic",sans-serif;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}



* { box-sizing:border-box; }
:root { padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
body { margin:0; background:var(--paper); color:var(--ink); font:400 15px/1.6 var(--font-body); }
.wrap { max-width:1200px; margin:0 auto; padding-block:28px 64px;
  padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px));
  display:grid; gap:56px; }
h1, h2, h3 { font-family:var(--font-display); text-wrap:balance; margin:0; line-height:1.05; }
h1 { font-weight:800; font-size:clamp(2.6rem, 7vw, 4.6rem); letter-spacing:.005em; }
h2 { font-weight:800; font-size:clamp(1.8rem, 4vw, 2.4rem); }
h3 { font-weight:600; font-size:1.45rem; }
p { margin:0; max-width:68ch; }
a { color:var(--cedar); }
code, .mono { font-family:var(--font-mono); font-size:.9em; }
.eyebrow { font:500 12px/1.2 var(--font-mono); letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.lede { color:var(--muted); }
.sec { display:grid; gap:18px; min-width:0; }
.sec-head { display:grid; gap:8px; }

/* title block */
.tb { border:1.5px solid var(--ink); background:var(--sheet); display:grid; grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); }
.tb-main { padding:22px 24px; display:grid; gap:12px; align-content:start; border-right:1.5px solid var(--ink); }
.tb-grid { display:grid; grid-template-columns:1fr 1fr; }
.tb-cell { padding:10px 14px; border-bottom:1px solid var(--rule); border-left:1px solid var(--rule); display:grid; gap:2px; min-width:0; }
.tb-cell:nth-child(2n+1) { border-left:0; }
.tb-cell .k { font:500 11px/1.2 var(--font-mono); letter-spacing:.06em; text-transform:uppercase; color:var(--muted); }
.tb-cell .v { font:600 15px/1.3 var(--font-body); font-variant-numeric:tabular-nums; }
@media (max-width:760px) { .tb { grid-template-columns:1fr; } .tb-main { border-right:0; border-bottom:1.5px solid var(--ink); } }

/* model */
.viewer { border:1px solid var(--rule-strong); background:var(--sheet); }
.cvwrap { position:relative; height:560px; min-width:0; }
#cv { display:block; width:100%; height:100%; touch-action:none; cursor:grab; }
#cv { border:0; }
#cv { opacity:0; transition:opacity .4s; } #cv.on { opacity:1; }
.cvload { position:absolute; inset:0; display:grid; place-items:center; background:var(--sheet); pointer-events:none; transition:opacity .4s; }
.cvload.done { opacity:0; } .cvload[hidden] { display:none; }
.cvload > div { display:grid; gap:10px; justify-items:center; }
.cvload span { font:500 11.5px/1.3 var(--font-display); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.cvload b { display:block; width:min(220px, 50vw); height:2px; background:var(--rule); overflow:hidden; }
.cvload i { display:block; height:100%; background:var(--ink); transform:scaleX(.02); transform-origin:left; transition:transform .3s; }

#cv:active { cursor:grabbing; }
.cvhint { position:absolute; left:12px; bottom:10px; font:12px var(--font-mono); color:var(--ink); background:color-mix(in srgb, var(--sheet) 82%, transparent); padding:3px 8px; border-radius:3px; pointer-events:none; }
.toolbar { display:flex; flex-wrap:wrap; gap:0 22px; align-items:center; margin-bottom:-12px; }
.toolbar .tgroup { flex-basis:100%; }
.toolbar .tgroup .eyebrow { min-width:52px; }
.tgroup { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
.tgroup .eyebrow { margin-right:4px; }
.chip-t { position:relative; display:inline-flex; }
.chip-t input { position:absolute; opacity:0; inset:0; margin:0; cursor:pointer; }
.chip-t span { font:500 13px/1 var(--font-body); padding:7px 11px; border:1px solid var(--rule-strong); border-radius:999px; background:var(--sheet); color:var(--muted); }
.chip-t input:checked + span { background:var(--ink); border-color:var(--ink); color:var(--sheet); }
.chip-t input:focus-visible + span { outline:2px solid var(--flag); outline-offset:2px; }
.btn { font:500 13px/1 var(--font-body); padding:8px 12px; border:1px solid var(--rule-strong); border-radius:4px; background:var(--sheet); color:var(--ink); cursor:pointer; }
.btn:hover { border-color:var(--ink); }
.btn:focus-visible { outline:2px solid var(--flag); outline-offset:2px; }
.btn.on { border-color:var(--flag); color:var(--flag); }
@media (max-width:860px) { .cvwrap { height:420px; } }

/* drawings */
.figs { display:grid; gap:28px; }
figure { margin:0; display:grid; gap:8px; min-width:0; }
.fig-scroll { overflow-x:auto; border:1px solid var(--rule); background:var(--sheet); }
.fig-scroll svg { display:block; width:100%; height:auto; }
.two > figure { grid-template-rows:1fr auto; }
.two .fig-scroll { display:flex; align-items:center; }
figcaption { font-size:13.5px; color:var(--muted); max-width:80ch; }
figcaption b { color:var(--ink); font-weight:600; }
.two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:28px; }
@media (max-width:900px) { .two { grid-template-columns:1fr; } }

.d-log { fill:var(--wood-fill); stroke:var(--wood-line); stroke-width:.8; }
.d-log.end { fill:var(--wood-end); }
.d-con { fill:var(--concrete); stroke:var(--rule-strong); stroke-width:.8; }
.d-met { fill:var(--metal); stroke:var(--steel); stroke-width:.8; }
.d-roofline { fill:none; stroke:var(--steel); stroke-width:1.1; stroke-dasharray:6 4; }
.d-slab { fill:var(--wood-peeled); stroke:var(--wood-line); stroke-width:.6; }
.d-oak { fill:var(--oak); stroke:var(--wood-line); stroke-width:.5; }
.d-fw { fill:var(--fw); stroke:var(--wood-line); stroke-width:.5; }
.d-gear { fill:var(--gear); stroke:var(--muted); stroke-width:.6; }
.brace-o { fill:none; stroke:var(--wood-line); }
.brace-i { fill:none; stroke:var(--wood-fill); }
.a-dim { stroke:var(--muted); stroke-width:.8; fill:none; }
.a-gd { stroke:var(--ink); stroke-width:1.2; }
.a-t { font:500 11.5px var(--font-body); fill:var(--ink); }
.a-tm { font:11px var(--font-mono); fill:var(--muted); }
.a-tl { font:600 13px var(--font-body); fill:var(--ink); }
.a-tag circle { fill:var(--sheet); stroke:var(--cedar); stroke-width:1.2; }
.a-tag text { font:500 10.5px var(--font-mono); fill:var(--cedar); }
.a-ar { stroke:var(--steel); stroke-width:1.6; fill:none; }
.a-arh { fill:var(--steel); }

/* joints */
.decide { display:grid; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); gap:14px 28px; margin:0; padding:0; list-style:none; }
.decide li { border-top:1.5px solid var(--ink); padding-top:10px; display:grid; gap:4px; align-content:start; }
.decide b { font-family:var(--font-display); font-weight:600; font-size:1.25rem; letter-spacing:.01em; }
.decide span { color:var(--muted); font-size:14px; }
.jgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:18px; }
@media (max-width:420px) { .jgrid { grid-template-columns:1fr; } }
.jcard { border:1px solid var(--rule-strong); background:var(--sheet); display:grid; gap:12px; padding:16px; align-content:start; min-width:0; scroll-margin-top:16px; }
.jcard:target, .jcard.flash { border-color:var(--flag); box-shadow:0 0 0 2px var(--flag); }
.jhead { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.jmark { font:500 13px/1 var(--font-mono); color:var(--cedar); border:1.5px solid var(--cedar); padding:5px 7px; border-radius:3px; }
.jcount { margin-left:auto; font:500 12px var(--font-mono); color:var(--muted); }
.jwhere { font-size:13.5px; color:var(--muted); }
.jcard ol { margin:0; padding-left:20px; display:grid; gap:6px; font-size:14px; }
.jcard svg { width:100%; height:auto; display:block; color:var(--ink); }
.fchips { display:flex; flex-wrap:wrap; gap:6px; }
.fchip { font:500 12px/1 var(--font-mono); padding:5px 8px; border-radius:3px; background:var(--paper); border:1px solid var(--rule); }
.g-w { fill:var(--wood-fill); stroke:var(--wood-line); stroke-width:1.2; }
.g-we { fill:var(--wood-end); stroke:var(--wood-line); stroke-width:1.2; }
.g-wp { fill:var(--wood-peeled); stroke:var(--wood-line); stroke-width:1.2; }
.g-cn { fill:var(--concrete); stroke:var(--rule-strong); stroke-width:1.2; }
.g-bg { fill:var(--sheet); stroke:var(--wood-line); stroke-width:1; }
.g-ink { fill:currentColor; }
.g-st { stroke:currentColor; stroke-width:1.6; fill:none; }
.g-hid { stroke-dasharray:4 3; }
.g-oak { fill:var(--oak); stroke:var(--wood-line); stroke-width:1; }
.g-ld { stroke:var(--muted); stroke-width:.8; fill:none; }
.g-t { font:500 11px var(--font-body); fill:currentColor; }
.g-tm { font:11px var(--font-mono); fill:var(--muted); }
.g-acc { stroke:var(--flag); stroke-width:2.2; fill:none; }
.g-acct { font:600 11px var(--font-body); fill:var(--flag); }
.g-mt { stroke:var(--steel); stroke-width:3; fill:none; }
.g-dim { stroke:var(--muted); stroke-width:.9; fill:none; }
.g-gd { stroke:currentColor; stroke-width:1.2; }
.g-bo { fill:none; stroke:var(--wood-line); stroke-width:16; }
.g-bi { fill:none; stroke:var(--wood-fill); stroke-width:13; }

/* tables */
.tbl { overflow-x:auto; border:1px solid var(--rule-strong); background:var(--sheet); }
table { border-collapse:collapse; width:100%; font-size:14px; }
th { text-align:left; font:500 11px/1.3 var(--font-mono); letter-spacing:.05em; text-transform:uppercase; color:var(--muted); padding:10px 12px; border-bottom:1.5px solid var(--ink); white-space:nowrap; }
td { padding:9px 12px; border-bottom:1px solid var(--rule); vertical-align:top; font-variant-numeric:tabular-nums; }
td.n, th.n { text-align:right; }
tfoot td { font-weight:600; border-bottom:0; border-top:1.5px solid var(--ink); }
.marks { font:12px var(--font-mono); color:var(--muted); max-width:320px; }
.pill { font:500 11px/1 var(--font-mono); padding:4px 7px; border-radius:999px; background:var(--ok-soft); color:var(--ok); white-space:nowrap; }
.pill.bad { background:var(--cedar-soft); color:var(--flag); }
.stock { display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr)); gap:12px; }
.stock div { border:1px solid var(--rule-strong); background:var(--sheet); padding:12px 14px; display:grid; gap:2px; }
.stock .q { font:800 2rem/1 var(--font-display); }
.stock .l { font-size:13.5px; }
.stock .s { font-size:12.5px; color:var(--muted); }
.note { font-size:13.5px; color:var(--muted); }

ol.seq { margin:0; padding:0; list-style:none; counter-reset:s; display:grid; gap:12px; max-width:860px; }
ol.seq li { counter-increment:s; display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:baseline; }
ol.seq li::before { content:counter(s); font:800 1.7rem/1 var(--font-display); color:var(--cedar); }
ul.qs { margin:0; padding-left:20px; display:grid; gap:8px; max-width:860px; }
.files { display:grid; gap:6px; font-size:14px; }
.files code { background:var(--sheet); border:1px solid var(--rule); padding:1px 5px; border-radius:3px; }
pre { margin:0; background:var(--sheet); border:1px solid var(--rule); padding:10px 12px; overflow-x:auto; font:13px var(--font-mono); }

/* quiet drafting touches */
.sec-head { border-bottom:1px solid var(--rule-strong); padding-bottom:10px; }
figure { counter-increment:fig; }
figcaption { display:flex; align-items:baseline; gap:10px; max-width:none; }
figcaption::before { content:counter(fig, upper-alpha); font:500 11px var(--font-mono); color:var(--muted); letter-spacing:.06em; }
figcaption::after { content:"NTS"; margin-left:auto; font:500 11px var(--font-mono); color:var(--muted); letter-spacing:.1em; }

/* ---- presentation-deck styling ---- */
:root, :root[data-theme] { --paper:#F6F1E6; --sheet:#FFFFFF; color-scheme:light; }
body { background-color:var(--paper); background-image:radial-gradient(circle, rgba(60,55,45,.13) .9px, transparent 1.3px); background-size:20px 20px; background-position:10px 10px; }
.wrap { gap:64px; padding-block:22px 72px; }
.hd { padding-bottom:10px; border-bottom:1px solid var(--ink); display:flex; flex-wrap:wrap; align-items:baseline; justify-content:space-between; gap:8px 24px; }
.sites { display:flex; gap:22px; font:500 12px/1 var(--font-display); letter-spacing:.16em; text-transform:uppercase; }
.sites a, .sites span { color:var(--muted); text-decoration:none; padding-bottom:5px; border-bottom:1px solid transparent; }
.sites a:hover { color:var(--ink); border-bottom-color:var(--rule-strong); }
.sites span { color:var(--ink); border-bottom-color:var(--ink); }
h1 { font:300 clamp(1.8rem, 4.6vw, 2.9rem)/1 var(--font-display); letter-spacing:.03em; }
h2 { font:400 clamp(1.4rem, 3vw, 1.85rem)/1.1 var(--font-display); letter-spacing:.02em; }
h3 { font:400 1.35rem/1.15 var(--font-display); letter-spacing:.01em; }
.eyebrow, th { font-family:var(--font-display); font-weight:500; letter-spacing:.16em; }
.sec-head { border-bottom:1px solid var(--rule-strong); padding-bottom:10px; }
main, .wrap { counter-reset:sec fig; }
.sec-head h2::before { counter-increment:sec; content:counter(sec, decimal-leading-zero); font:400 .62em var(--font-display); letter-spacing:.12em; color:var(--muted); margin-right:14px; vertical-align:.25em; }
.viewer { border-color:var(--rule); }
/* toolbar: quiet text controls instead of chips */
.toolbar { gap:0 28px; position:relative; z-index:1; }   /* above the lead sketch, whose blend layer overlaps the top rows */
.chip-t span, .btn { font:500 11.5px/1 var(--font-display); letter-spacing:.14em; text-transform:uppercase; border-radius:0; }
.chip-t span { border:0; background:transparent; padding:7px 2px 6px; border-bottom:1px solid transparent; color:var(--muted); }
.chip-t input:checked + span { background:transparent; color:var(--ink); border-bottom-color:var(--ink); }
.btn { border:0; background:transparent; padding:7px 2px 6px; border-bottom:1px solid transparent; }
.btn:hover { border-bottom-color:var(--rule-strong); }
.btn.on { border-bottom-color:var(--flag); }
.tgroup { gap:4px 16px; }
/* project data: a two-column spec list with hairlines */
.specs { margin:0; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); column-gap:56px; border-top:1px solid var(--ink); }
.specs > div { display:flex; justify-content:space-between; align-items:baseline; gap:16px; padding:11px 0; border-bottom:1px solid var(--rule); min-width:0; }
.specs dt { font:500 11.5px/1.3 var(--font-display); letter-spacing:.16em; text-transform:uppercase; color:var(--muted); }
.specs dd { margin:0; font:400 15px/1.3 var(--font-body); font-variant-numeric:tabular-nums; text-align:right; }
@media (max-width:640px) { .specs { grid-template-columns:minmax(0,1fr); } }
.fig-scroll, .tbl { border-color:var(--rule); }
figcaption b { font:400 14px var(--font-display); letter-spacing:.08em; text-transform:uppercase; }
/* watercolor sketches: painted straight onto the page, no cards */
.lead { margin:-30px 0 -20px; counter-increment:none; }
.lead img, .sk img { display:block; width:100%; height:auto; mix-blend-mode:multiply; }
.sk-grid { overflow-x:clip; display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:18px 40px; }
.sk-grid .wide { grid-column:1 / -1; width:88%; justify-self:center; }
@media (max-width:760px) { .sk-grid .wide { width:100%; } }
.sk-grid .mid { width:100%; max-width:900px; justify-self:center; }
.sk { gap:2px; counter-increment:none; }
@media (max-width:760px) { .sk-grid { grid-template-columns:minmax(0,1fr); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
</style>

<div class="wrap">

<header class="hd"><h1>Rainbow Palace</h1><nav class="sites" id="sites" aria-label="Sites"></nav></header>

<section class="sec" id="model" aria-label="3D model">

  </dl>
</section>

<section class="sec" id="sketches" aria-labelledby="h-sk">
  <div class="sec-head">
    <h2 id="h-sk">Sketches</h2>
  </div>
  <!--SKETCHES--><div class="sk-grid">
    <figure class="sk wide"><img src="img/over.webp" width="2000" height="1220" loading="lazy" alt="Watercolor sketch from above the barn's open front, workbenches and tool chest inside, the woodpile in the lean-to, the chicken coop and run beyond and the neighbors' house through the pines"></figure>
    <figure class="sk wide"><img src="img/back.webp" width="2000" height="1111" loading="lazy" alt="Watercolor sketch of the barn's back lean-to full of firewood, the house behind it with one car in the drive"></figure>

the tube, and drive two 4 ft pieces of #4 rebar about 3 ft into undisturbed soil through the bottom, leaving a foot standing up inside. Then pour.","Cast two 1/2 x 12 in spikes head-down in the wet pier, 6 in sticking up, 4 in apart.","Peel the bottom foot of the post. Cut the butt square and drill two 9/16 in holes 6.5 in deep to match.","Lay a scrap of metal roofing or tar paper on the pier as a capillary break, then drop the post over the pins."],"focus":[-12.0,0.8,8.0],"focus_r":6,"count":19},"J2":{"name":"Plate on post","where":"Top of each side-wall and lean-to post","fasteners":{"spike12":2},"how":["Cut the post top square. Flatten a 5 in wide seat on the underside of the plate, about 1.25 in deep.","Drill a 1 in counterbore 3 in deep and a 3/8 in pilot, then drive two 1/2 x 12 in spikes down into the post.","The side plates are one log each, about 17 ft, so there is no splice."],"focus":[12.0,10.4,0],"focus_r":5,"count":15},"J4":{"name":"Tie over plate","where":"Each truss, both side walls","fasteners":{"spike12":1},"how":["Scribe a saddle notch in the underside of the tie, about 1.5 in deep, so it locks over the plate right above a post.","One 1/2 x 12 in spike down through the tie into the plate and post (counterbore 2 in)."],"focus":[12.0,10.988,0],"focus_r":5,"count":6},"J5":{"name":"Rafter heel","where":"Each rafter foot, beside its tie","fasteners":{"spike12":2,"peg1":1},"how":["The rafter rides beside the tie end, not on top of it. Saddle-notch its underside about 1.5 in over the plate.","Flatten the touching faces of rafter and tie about 1.5 in each. Stop the tie's flat at a square shoulder (the cog) just outside the plate, and cut the rafter 2 in deeper beyond that point so the two lock together. The shoulder is what stops the rafter foot sliding out.","Keep at least 12 in of tie past the cog. Drive two 1/2 x 12 in spikes and one 1 in oak peg through rafter and tie.","Bevel the top of the tie end down to the line of the rafter tops, so it never pokes up into the purlins or the roof.","The rafter tail runs on past the tie end to make the eave over the lean-to."],"focus":[12.2,10.988,8.0],"focus_r":4.5,"count":6},"J6":{"name":"Peak and king post","where":"Each truss peak","fasteners":{"peg1":1,"spike12":2,"spike8":1},"how":["The two rafters pass each other on either side of the king post, tips running about 3 in past.","Cut a 2 in shelf on each side of the king post head for a rafter to sit on. The king post hangs from these shelves: the struts push up on the rafters and pull down on the king post.","Flatten the touching faces and drive one 1 in oak peg through rafter, king post and rafter, plus a 1/2 x 12 in spike from each side.","Stop the king post foot 1/2 in above the tie so the tie never carries it. One 1/2 x 8 in spike up through the tie into the foot keeps the tie from sagging."],"focus":[0,16.986,8.0],"focus_r":5,"count":3},"J7":{"name":"Purlin seat","where":"Every purlin crossing a rafter","fasteners":{"spike8":1},"how":["Run a string line along the roof plane. Scribe each purlin's seat so its top lands on the line.","Plane a 3 in flat strip along the top of each purlin for the roofing screws. The metal lies on these flats, so they are the true roof plane.","One 1/2 x 8 in spike down through the purlin into the rafter (1.5 in counterbore).","The lowest purlin on each slope also crosses the tie ends: cut a seat in the top of each tie end so the purlin lands on the string line, and spike it there too."],"focus":[6,14.586,8.5],"focus_r":5,"count":110},"J8":{"name":"Knee brace","where":"Every brace end","fasteners":{"peg34":1,"spike8":1},"how":["Pick a natural crook. Scribe each end into a 1 in deep housing in the post and beam, so the brace bears on the housing, not the peg.","One 3/4 in oak peg through each end, left 1 in proud with a chamfer. Add one 1/2 x 8 in spike if it rattles.","On the front and back trusses the braces start just above the door tops so they stay clear of the openings."],"focus":[10.7,9.767,0],"focus_r":6,"count":68},"J9":{"name":"Lean-to rafter seat","where":"High end of each lean-to rafter","fasteners":{"spike12":2,"peg1":1},"how":["Middle rafter: cut a 2 in deep housing in the outside of the middle side post, with a flat shelf, and set the rafter end in it.","Edge rafters: each rides beside the inside face of a main corner post. Flatten both faces about 1.5 in, cut a 2 in shelf in the post for the rafter to sit on, and drive a 1 in oak peg through both.","Two 1/2 x 12 in spikes through each rafter into its post.","Set the seats so the lean-to roof passes under the main rafter tails with a few inches of air. The main eave then laps over the lean-to roof, so no flashing is needed."],"focus":[12.4,9.388,0],"focus_r":5.5,"count":10},"J10":{"name":"Lean-to rafter on outer plate","where":"Low end of each lean-to rafter","fasteners":{"spike12":1},"how":["Saddle notch the rafter underside about 1.5 in over the outer plate.","One 1/2 x 12 in spike down through the rafter into the plate and post."],"focus":[22.0,6.788,7.4],"focus_r":6,"count":10},"J11":{"name":"Crossed barge poles","where":"Front and back gables","fasteners":{"spike8":0,"peg1":1},"how":["Spike a 5.5 in pole to the purlin ends along each rake, one 1/2 x 8 in spike per purlin.","Let both poles run 15 in past the ridge, half-lap the crossing and drive one 1 in oak peg."],"focus":[0,17.986,10.0],"focus_r":8,"count":2},"J12":{"name":"Girts and slab siding","where":"Back wall, shop walls, lean-to walls","fasteners":{},"how":["Flatten a small seat on each post and spike the girts on with 1/2 x 8 in spikes.","Hang slabs vertically, live edge out, 1 in gaps. Two 1/4 x 5 in nails per girt crossing, pre-drilled near the ends.","Shop walls: the firewood-side wall gets slabs on the shop face; the tractor-side wall gets them on the tractor face so the truss braces stay clear.","On the lean-tos the slab walls go outside the posts and hide the posts and braces."],"focus":[-22.0,3.5,-2],"focus_r":11,"count":0},"J14":{"name":"Post under tie","where":"Front and back walls at x = -4 and +4","fasteners":{"spike12":2},"how":["Cradle the post top to the underside of the tie and spike up through the post top at an angle or down through the tie.","These posts carry little roof load. They hold the door rail, the wall girts and the braces."],"focus":[4.0,9.988,8.0],"focus_r":6,"count":4},"J15":{"name":"Truss strut","where":"Two per truss, king post foot to rafter","fasteners":{"spike12":1,"spike8":1},"how":["Foot: house the strut 1.5 in into the side of the king post just above its bottom end, square to the strut.","Head: cut a shallow bird's mouth in the rafter underside, about 5 ft (level) from the ridge, and seat the strut in it.","Cut the strut a hair long and tap it in so it is snug before any snow. One 1/2 x 12 in spike at the head, one 1/2 x 8 in at the foot.","The strut leans 6 in sideways along its length because each rafter sits beside the king post. That's fine."],"focus":[2.5,12.488,8.0],"focus_r":6.5,"count":6},"J16":{"name":"Swinging barn doors","where":"Shop front, bays 1 and 2","fasteners":{},"how":["Hang each door on the outside face of the front posts: bay 1 hinged on the SW corner post, bay 2 on the post between bays 2 and 3. They swing out and away from each other.","Flatten a 4 in strip on each hinge post so the straps sit flat. Three 36 in strap hinges per door, lagged through the post flat.","Build each door as slabs on three ledgers with two diagonal braces. Each brace runs up from the hinge side toward the latch side, so it pushes the far corner up and the door doesn't sag.","Nothing goes above the doors; it stays open up to the tie. The doors close against the posts, so let each door lap about 3 in onto its posts.","An oak drop bar across the middle post holds both doors shut. A cane bolt in each door holds it open in the wind.","Hang the doors with 1 in of ground clearance and keep the swing area level, or they'll drag when the ground heaves."],"focus":[-4.0,4,12.0],"focus_r":17,"count":1}},"cutlist":[{"role":"post","part":"Main post","species":"Cedar","d_in":10.0,"len_ft":10.0,"qty":6,"marks":["P1","P2","P3","P4","P5","P6"],"weight":1698.0},{"role":"tie_post","part":"Post under a tie","species":"Cedar","d_in":9.0,"len_ft":11.0,"qty":4,"marks":["PT1","PT2","PT3","PT4"],"weight":1032.0},{"role":"plate","part":"Side plate","species":"Cedar","d_in":8.0,"len_ft":18.0,"qty":2,"marks":["PLSW","PLNE"],"weight":772.0},{"role":"tie","part":"Tie beam","species":"Cedar or straight ponderosa","d_in":9.0,"len_ft":27.5,"qty":3,"marks":["T1","T2","T3"],"weight":2484.0},{"role":"rafter","part":"Rafter","species":"Cedar","d_in":8.0,"len_ft":16.0,"qty":6,"marks":["R1E","R1W","R2E","R2W","R3E","R3W"],"weight":1986.0},{"role":"king","part":"King post","species":"Cedar","d_in":8.0,"len_ft":6.5,"qty":3,"marks":["K1","K2","K3"],"weight":342.0},{"role":"strut","part":"Truss strut","species":"Cedar","d_in":5.5,"len_ft":6.0,"qty":6,"marks":["S1E","S1W","S2E","S2W","S3E","S3W"],"weight":312.0},{"role":"purlin","part":"Purlin","species":"Cedar","d_in":5.5,"len_ft":20.5,"qty":16,"marks":["PUE1","PUE2","PUE3","PUE4","PUE5","PUE6","PUE7","PUE8","PUW1","PUW2","PUW3","PUW4","PUW5","PUW6","PUW7","PUW8"],"weight":4016.0},{"role":"barge","part":"Crossed barge pole","species":"Cedar","d_in":5.5,"len_ft":17.0,"qty":4,"marks":["BGSEE","BGSEW","BGNWE","BGNWW"],"weight":764.0},{"role":"brace","part":"Knee brace","species":"Cedar crook","d_in":4.5,"len_ft":5.0,"qty":10,"marks":["BT1E","BT1W","BT2E","BT2W","BT3E","BT3W","BLSWX","BLNEX","BLNWE1","BLNWE3"],"weight":250.0},{"role":"brace","part":"Knee brace","species":"Cedar crook","d_in":4.5,"len_ft":4.5,"qty":12,"marks":["BP2L","BP2R","BP4L","BP4R","BP1L","BP1R","BP3L","BP3R","BSSWB","BSSWF","BSNEB","BSNEF"],"weight":264.0},{"role":"brace","part":"Knee brace","species":"Cedar crook","d_in":4.5,"len_ft":4.0,"qty":12,"marks":["BLSW1R","BLSW2L","BLSW2R","BLSW3L","BLNE1R","BLNE2L","BLNE2R","BLNE3L","BL   };
  // the drawings work in the barn's own frame: the model may set it down off the site origin (page.center)
  const LM = (C0[0] || C0[1] || C0[2]) ? M.members.map(m => { const o = { ...m }; ['a', 'b', 'c'].forEach(k => { if (Array.isArray(m[k]) && m[k].length === 3) o[k] = [m[k][0] - C0[0], m[k][1] - C0[1], m[k][2] - C0[2]]; }); return o; }) : M.members;
  function shapes(v) {
    const out = [];
    LM.forEach(m => {
      if (!v.keep(m)) return;
      const cls = (v.cls && v.cls(m)) || baseCls(m);
      if (m.type === 'log') {
        const pa = v.proj(m.a), pb = v.proj(m.b); const du = pb[0] - pa[0], dv = pb[1] - pa[1], l2 = Math.hypot(du, dv);

      } else if (m.type === 'crook') {
        const pts = []; let dep = -1e9; for (let i = 0; i <= 12; i++) { const p = bez(m, i / 12); pts.push(v.proj(p)); dep = Math.max(dep, v.depth(p)); }
        out.push({ k: 'l', pts, w: m.d, cls, dep, id: m.id });
      } else {
        const cs = corners(m); out.push({ k: 'p', pts: hull(cs.map(v.proj)), cls, dep: Math.max(...cs.map(v.depth)), id: m.id });

    list.forEach(s => { if (s.k === 'c') { ext(s.u - s.r, s.v - s.r); ext(s.u + s.r, s.v + s.r); } else s.pts.forEach(p => ext(p[0], p[1])); });
    (opt.extra || []).forEach(p => ext(p[0], p[1]));
    const k = opt.k, mg = opt.m;
    const W = (u1 - u0) * k + mg.l + mg.r, H = (v1 - v0) * k + mg.t + mg.b;
    svg.setAttribute('viewBox', `0 0 ${W.toFixed(0)} ${H.toFixed(0)}`);
    while (svg.firstChild) svg.removeChild(svg.firstChild);

  };

  };
  const isLT = m => m.group.indexOf('leanto') === 0;
  const xs = [LT.SW.x_out, -S.L / 2, S.L / 2, LT.NE.x_out];

  (function () {
    const v = {

      { v: S.levels.ridge, label: 'Ridge' }, { v: S.levels.eave, label: 'Main eave' },
      { v: S.levels.door_top, label: 'Door top' }, { v: LT.SW.y_low_clear, label: 'Lean-to\nlow side' },

  })();

  // section through the middle truss, looking NW
  (function () {

    const v = {
